[package]
name = "pulumi-profile-selector"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Interactive Pulumi profile selector CLI tool"
license = "MIT"
repository = "https://github.com/stephenstubbs/pulumi-profile-selector"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
inquire = { version = "0.9.5", default-features = false, features = ["crossterm", "fuzzy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
